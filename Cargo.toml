[package]
name = "plamo-translate"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "地元翻訳くん - translated by PLaMo. Local screen, text and live audio translation."
license = "MIT"
default-run = "plamo-translate"

[build-dependencies]
winresource = "0.1.34"

[dependencies]
anyhow = "1"
base64 = "0.22"
bzip2 = "0.6"
arboard = "3"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
eframe = { version = "0.33", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence"] }
global-hotkey = "0.7"
hound = "3.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
libloading = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls", "stream"] }
rfd = "0.15"
raw-window-handle = "0.6"
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tiny_http = "0.12"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
wasapi = "0.22"
windows = { version = "0.62", features = ["Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging"] }
xcap = "0.8.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = "debuginfo"
